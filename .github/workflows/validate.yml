name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  okf-and-repo-gates:
    name: OKF + repo gates (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_okf -Mode Strict
        shell: pwsh
        run: ./scripts/check_okf.ps1 -Root (Get-Location) -Mode Strict
      - name: check_repo
        shell: pwsh
        run: ./scripts/check_repo.ps1 -Root (Get-Location)

  links-and-whitespace:
    name: Markdown links + whitespace (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check_links.py
        run: python scripts/check_links.py .
      - name: git diff --check
        run: git diff --check