name: Knowledge integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-knowledge.txt
      - name: Install pinned YAML and CommonMark parsers
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-knowledge.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python graph, YAML, and CommonMark regressions
        run: |
          python -B scripts/test_knowledge_validation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: A-star archived-observation recipe integrity (Python, both platforms)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python -B evidence/algorithms/astar/scripts/test_archive_recipe.py --log-jsonl "$env:RUNNER_TEMP/astar-archive-recipes-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: A-star contract experiment (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          python -B evidence/algorithms/astar-contract/test_astar_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: A-star cache correctness and observed measurement (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: |
          python -B evidence/algorithms/astar/scripts/run_benchmark.py --output-dir "$env:RUNNER_TEMP/astar-measurement-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --compiler g++-14 --queries 1000 --repeats 5 --seed 20261004 --timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tick pure-policy contracts and exact model records (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: |
          python -B evidence/server/tick-scheduler/scripts/run_policy.py --output-dir "$env:RUNNER_TEMP/tick-policy-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --compiler g++-14 --timeout 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synthetic entry and JIP contracts and runner negative controls (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 8
        run: |
          bash evidence/tests/entry-core/scripts/run_all.sh --output-dir "$env:RUNNER_TEMP/entry-isolation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --cxx g++-14 --ubsan --with-self-test --pwsh pwsh 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/entry-isolation-console-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Migration safety regression fixtures
        if: ${{ !cancelled() }}
        run: |
          python -B scripts/test_migrate_knowledge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Profiling functional contract (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          python -B evidence/labs/profiling/scripts/test_profiling_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: C++23 expected contract and runner safety (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          python -B evidence/cpp/expected-contract/run_expected_contract.py --cxx g++-14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B evidence/cpp/expected-contract/test_runner_safety.py --cxx g++-14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: C++ foundation contracts and negative controls (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          python -B evidence/cpp/foundation-contracts/run.py --cxx g++-14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full graph, coverage, YAML, and Markdown validation
        if: ${{ !cancelled() }}
        run: |
          python -B scripts/validate_knowledge.py --json-report "$env:RUNNER_TEMP/knowledge-validation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generated-view regression fixtures
        if: ${{ !cancelled() }}
        run: |
          python -B scripts/test_render_knowledge_views.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generated views are current
        if: ${{ !cancelled() }}
        run: |
          python -B scripts/render_knowledge_views.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing PowerShell gates and all four regression suites
        if: ${{ !cancelled() }}
        run: |
          # Each checker runs in a separate pwsh process: its exit statement
          # must not prevent the other existing gates from being exercised.
          $failed = [Collections.Generic.List[string]]::new()
          $checks = @(
            @{ File = 'scripts/check_okf.ps1'; Args = @('-Root', $PWD.Path, '-Mode', 'Changed') },
            @{ File = 'scripts/check_okf.ps1'; Args = @('-Root', $PWD.Path, '-Mode', 'Audit') },
            @{ File = 'scripts/check_okf.ps1'; Args = @('-Root', $PWD.Path, '-Mode', 'Strict') },
            @{ File = 'scripts/check_repo.ps1'; Args = @('-Root', $PWD.Path) },
            @{ File = 'scripts/check_architecture.ps1'; Args = @('-Root', $PWD.Path) },
            @{ File = 'scripts/test_architecture.ps1'; Args = @() },
            @{ File = 'scripts/test_kb_scope.ps1'; Args = @() },
            @{ File = 'scripts/test_okf_changed.ps1'; Args = @() },
            @{ File = 'scripts/test_repo_paths.ps1'; Args = @() }
          )
          foreach ($check in $checks) {
            $arguments = @('-NoProfile', '-File', $check.File) + $check.Args
            & pwsh @arguments
            if ($LASTEXITCODE -ne 0) { $failed.Add($check.File + ' ' + ($check.Args -join ' ')) }
          }
          if ($failed.Count) {
            $failed | ForEach-Object { Write-Output "FAILED: $_" }
            exit 1
          }
      - name: Teaching evidence rules and preserved-source regressions
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          & pwsh -NoProfile -File scripts/test_quality_evidence.ps1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/quality-evidence-regressions.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit-range whitespace check
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            git rev-parse --verify --end-of-options "${env:BASE_SHA}^{commit}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --check "${env:BASE_SHA}..HEAD"
          } else {
            # First push/manual run: include root commit content, not an empty
            # working-tree comparison that always passes after checkout.
            git diff-tree --check --root -r HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain complete validation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-validation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/knowledge-validation.json
            ${{ runner.temp }}/quality-evidence-regressions.txt
            ${{ runner.temp }}/astar-archive-recipes-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
            ${{ runner.temp }}/astar-measurement-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/astar-measurement-${{ github.run_id }}-${{ github.run_attempt }}/*.csv
            ${{ runner.temp }}/tick-policy-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/tick-policy-${{ github.run_id }}-${{ github.run_attempt }}/*.csv
            ${{ runner.temp }}/entry-isolation-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/entry-isolation-${{ github.run_id }}-${{ github.run_attempt }}/*.txt
            ${{ runner.temp }}/entry-isolation-console-${{ github.run_id }}-${{ github.run_attempt }}.txt
          if-no-files-found: warn
