# Knowledge Base Taxonomy
# domains 保留兼容的领域/辅助目录登记；顶层责任层唯一清单为 architecture.json。
# 新增主题以现有领域为先；来源集合不是主题主分类。
# 状态取值：draft（草案）/ active（已确认）/ archived（已归档）
version: 5
architecture: ".kb/architecture.json"

okf:
  profile: ".kb/okf-profile.yaml"
  mapping: "Domain -> Subdomain -> Topic"
  source_is_not_taxonomy: true
  obsidian_is_consumer: true

navigation:
  strategy: virtual-first
  canonical_paths: preserved
  global_moc: "00_Index/MOC.md"
  domain_mocs:
    00-计算机与工程基础: "00_Index/domains/计算机与工程基础.md"
    游戏知识: "00_Index/domains/游戏知识.md"
    游戏服务端: "00_Index/domains/游戏服务端.md"
    游戏算法: "00_Index/domains/游戏算法.md"
    游戏AI: "00_Index/domains/游戏AI.md"
    游戏测试与质量: "00_Index/domains/游戏测试与质量.md"
  axes:
    cross_domain_topics: "00_Index/axes/跨域主题.md"
    scope_and_lifecycle: "00_Index/axes/知识边界与生命周期.md"
    properties: "00_Index/Knowledge.base"
  physical_restructure:
    status: gated
    pilot_required: true
    preserve_maturity_and_verified: true

domains:
  00-计算机与工程基础:
    description: C++、OS/Linux、体系结构、网络、数据库与分布式、安全、数学、软件工程、容器与可观测性底座。
    status: active
    subdomains:
      01-C++核心: C++ 对象生命周期、RAII、值语义。
      02-C++对象模型与内存: 对象布局、虚派发、STL 容器与分配器。
      03-现代C++与泛型: Concepts、Ranges、异常、类型系统与标准库实现。
      04-C++并发与内存模型: 原子、内存序、无锁与缓存竞争。
      05-数据结构与复杂度: 复杂度、容器选型与缓存局部性。
      06-操作系统: 进程线程、虚拟内存、文件系统、权限与隔离。
      07-Linux系统编程: Socket、Epoll、Reactor 等系统编程。
      08-计算机体系结构与性能: CPU、ISA、ABI、编译器优化、GPU 异构与硬件辅助虚拟化。
      09-计算机网络基础: TCP/UDP、QUIC/HTTP3、IPv6/NAT、发现与负载均衡。
      10-编译链接与ABI: 编译、链接、加载、符号与 ABI。
      11-工程调试与性能分析: 调试器、Sanitizer、Profiler 与排障闭环。
      12-数据库与分布式系统: 存储引擎、事务、一致性、共识、缓存与消息。
      13-数学与算法基础: 离散数学、概率统计、线性代数与数值计算。
      14-安全与密码基础: TLS、认证授权、威胁建模、内存安全与反作弊。
      15-软件工程与构建: Git、构建、依赖、测试、Fuzz 与 CI/CD。
      16-容器云与可观测性: 容器隔离、Metrics、Tracing、SLO 与故障演练。
  游戏知识:
    description: UE 客户端开发与引擎源码分析（13 大分类，含引擎源码纵深层）。
    status: active
    subdomains:
      00-全栈运行闭环: 端到端协作总览。
      01-引擎基础: UObject、反射、Actor 生命周期、World、流送。
      02-渲染与图形: 渲染管线、材质、光照、Nanite、Lumen、后处理。
      03-游戏玩法编程: GAS、输入、Tag、委托、移动、背包、存档。
      04-动画系统: 动画蓝图、蒙太奇、IK、AnimNext、动作战斗与打击手感。
      05-AI系统: 行为树、感知、NavMesh、Mass、StateTree。
      06-网络同步: 复制、RPC、预测、ReplicationGraph、回放。
      07-UI与性能优化: UMG、MVVM、Profiling、调试。
      08-工具链与打包发布: UBT/UAT、插件、GameFeatures、DS 构建。
      09-物理系统: Chaos、碰撞、约束、破坏、车辆。
      10-音频系统: 播放、衰减、MetaSound、Quartz。
      11-VFX与Niagara: Niagara 粒子、流体与性能。
      12-引擎源码分析: UE5.8 引擎源码纵深层（01-56）。
      13-世界构建与过场: Landscape、Foliage、PCG、Sequencer、ICVFX。
  游戏服务端:
    description: 游戏服务端架构、网络、数据业务、业务系统、平台可靠性、DS 平台化与世界模拟运行时。
    status: active
    subdomains:
      01-架构与网络: 服务器架构、网络协议、帧同步、并发。
      02-数据与业务: 数据库、缓存、排行榜、部署运维。
      03-业务系统设计: 背包、任务、商城、匹配、战斗、活动。
      04-平台与可靠性: 鉴权、限流、幂等、分布式事务、容灾、灰度。
      05-UE Dedicated Server平台化: DS 生命周期、Linux 部署、扩缩容。
      06-世界模拟与运行时: MainLoop、Timer、Entity/Authority、Scene、AOI、跨 Zone 迁移、GameClock、Snapshot 与背压。
  游戏算法:
    description: 寻路图论、数学碰撞与工程技巧。
    status: active
    subdomains:
      01-寻路与图论: 图论、A*、流场、空间分区。
      02-数学与碰撞: 向量、四元数、插值、碰撞、弹道。
      03-工程与实用技巧: 随机、程序化生成、AOI、位运算、序列化。
      04-确定性与基准工程: 动态寻路、NavMesh、RVO、联机确定性。
  游戏AI:
    description: 游戏 AI 决策架构、移动学习与服务端 AI。
    status: active
    subdomains:
      01-决策与架构: 感知、状态机、行为树、Utility、GOAP。
      02-移动学习与服务端: 移动、战斗、学习型 AI、服务端 AI。
      03-评测与安全: AI 评测回放、LLM 安全、自动测试玩家。
  游戏测试与质量:
    description: 测试策略、自动化、压测与 CI 门禁。
    status: active
    subdomains: {}
  系统实战:
    description: 项目树：技能、Buff、假人AI 等端到端业务链路。
    status: active
    subdomains: {}
  工作日志:
    description: 维护经验与复盘日志（只增不改）。
    status: active
    subdomains: {}
  笔记:
    description: 短笔记与实验记录。
    status: active
    subdomains: {}
  读书笔记:
    description: 外部书籍与专栏的来源精读层（Game AI Pro 各卷、游戏引擎架构两卷）；作为 sources 责任层按书目保留读者上下文，不复制既有领域正文，不参与知识成熟度门禁。
    status: active
    subdomains: {}
  evidence:
    description: 实验证据链（src / scripts / results）。
    status: active
    subdomains:
      algorithms: 算法实验（AOI、A*）。
      labs: 语言/系统实验（原子、move、epoll、false-sharing）。
      server: 服务端实验（Tick Scheduler）。
  方案:
    description: 执行方案与规划。
    status: active
    subdomains: {}
  00_Index:
    description: 全局导航索引与 MOC（非知识正文）。
    status: active
    subdomains: {}
  Knowledge:
    description: 经分类决策确认的领域外通用主题扩展口；不得复制既有六领域。
    status: active
    subdomains: {}
  Projects:
    description: 项目专属知识入口（当前骨架，待流入）。
    status: active
    subdomains: {}
  Inbox:
    description: 未处理材料入口。
    status: active
    subdomains: {}
  Archive:
    description: 历史原材料与删除候选。
    status: active
    subdomains: {}
  learning:
    description: 稳定规则与维护经验（lessons / log）。
    status: active
    subdomains: {}
